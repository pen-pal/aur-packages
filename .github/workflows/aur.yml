name: AUR

on:
  schedule:
    # Hourly: GitHub may delay or drop scheduled runs, so a missed slot costs an hour, not six.
    - cron: '17 * * * *'
  # Manual or API runs only check for new releases, like the schedule, unless forced.
  # GitHub drops many scheduled runs, so an external trigger can call this hourly.
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and republish every package even without a new upstream release
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['*/PKGBUILD', '.github/workflows/aur.yml']
  pull_request: # build and test only, never publish
    paths: ['*/PKGBUILD', '.github/workflows/aur.yml']

permissions:
  contents: read

concurrency:
  group: aur-${{ github.event.pull_request.number || 'publish' }}

defaults:
  run:
    shell: bash

jobs:
  # Runs upstream code (makepkg, installed binary). Holds no secrets.
  build:
    name: build ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          # pkg = folder name = AUR package name; upstream = GitHub repo with releases; check = smoke test
          - { pkg: shellfirm-bin, upstream: kaplanelad/shellfirm, check: shellfirm --version }
          - { pkg: caveman-bin, upstream: JuliusBrussee/caveman, check: caveman --version }
          - { pkg: ctfkit, upstream: compliancetf/ctfkit, check: ctfkit --version }
          - { pkg: artex-bin, upstream: BaaRai/ARTEX, check: artex -h }
          - { pkg: gpu-mcp-server, upstream: pmady/gpu-mcp-server, check: gpu-mcp-server --version }
          - { pkg: zero-breach-toolkit-bin, upstream: interplains/Zero-Breach-Toolkit, check: zero-breach-toolkit --version }
          - { pkg: prime-agent-bin, upstream: PrimeIntellect-ai/prime-agent, check: prime-agent --version }
          - { pkg: tfk8s-bin, upstream: jrhouston/tfk8s, check: tfk8s --version }
          - pkg: kicad-routing-tools
            upstream: drandyhaas/KiCadRoutingTools
            check: env PYTHONPATH=/usr/share/kicad/scripting/plugins/KiCadRoutingTools/rust_router python -c "import grid_router"
          - { pkg: github-dorks-git, upstream: techgaun/github-dorks, check: github-dorks --list-categories }
          - { pkg: kubectl-ate, upstream: agent-substrate/substrate, check: kubectl-ate --version }
          # The server itself refuses to start with the example password, so load its modules.
          - pkg: obsidian-anysocket-sync-server
            upstream: lynxaegon/obsidian-anysocket-sync-server
            check: cd /usr/lib/obsidian-anysocket-sync-server && node -e "for (const m of process.argv.slice(1)) require(m)" anysocket node-cron node-diff3 ./libs/DB
          - { pkg: paccor-bin, upstream: nsacyber/paccor, check: paccor --help }
          - { pkg: func-e, upstream: tetratelabs/func-e, check: func-e --version }
          - { pkg: agentcore-cli-bin, upstream: aws/agentcore-cli, check: agentcore --version }
          # Loads taskcat's config schema: catches dependency breakage that --version would not.
          - pkg: taskcat
            upstream: aws-ia/taskcat
            check: /usr/lib/taskcat/bin/python -c "from taskcat._dataclasses import GeneralConfig; GeneralConfig().to_dict()"
    env:
      AUR_PKG: ${{ matrix.pkg }}
      UPSTREAM: ${{ matrix.upstream }}
    steps:
      - name: Install tools
        working-directory: /
        run: |
          pacman -Syu --noconfirm --needed git pacman-contrib jq namcap
          useradd -m builder

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check upstream release
        id: check
        working-directory: ${{ matrix.pkg }}
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          polling=false
          if [[ $GITHUB_EVENT_NAME == schedule ||
                ( $GITHUB_EVENT_NAME == workflow_dispatch && $FORCE != true ) ]]; then
            polling=true
          fi
          # VCS package: makepkg's pkgver() follows upstream's branch, so there are no
          # releases to poll; build it on pushes, pull requests and forced runs only.
          if [[ $AUR_PKG == *-git ]]; then
            if $polling; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          # Newest plain [v]X.Y.Z (or paccor-style X.YrN) release: skips side tags (caveman's bin-v*,
          # middleware-*-v*) and release candidates published without the prerelease flag (v1.0.0-rc.3).
          latest=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$UPSTREAM/releases?per_page=30" |
            jq -r '[.[] | select(.draft or .prerelease | not) | .tag_name | select(test("^v?[0-9]+(\\.[0-9]+)*(r[0-9]+)?$"))] | first')
          latest=${latest#v}
          [[ $latest =~ ^[0-9][0-9A-Za-z.]*$ ]] || { echo "bad upstream tag: $latest"; exit 1; }
          current=$(source PKGBUILD && echo "$pkgver")
          echo "current=$current latest=$latest"
          if (( $(vercmp "$latest" "$current") > 0 )); then
            sed -i "s/^pkgver=.*/pkgver=$latest/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          elif $polling; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        if: steps.check.outputs.skip != 'true'
        working-directory: ${{ matrix.pkg }}
        env:
          BUMPED: ${{ steps.check.outputs.bumped }}
        run: |
          deps=$(source PKGBUILD && echo "${depends[@]}" "${makedepends[@]}")
          # shellcheck disable=SC2086 # word splitting intended; pacman errors on an empty list
          [[ -z $deps ]] || pacman -S --noconfirm --needed $deps
          chown -R builder .
          # Refresh checksums only for a new upstream version. Otherwise makepkg verifies
          # downloads against the committed sums, so a replaced upstream asset fails here.
          if [[ $BUMPED == true ]]; then su builder -c updpkgsums; fi
          # Upstream signing keys for validpgpkeys (AUR convention: keys/pgp/<fingerprint>.asc).
          if [[ -d keys/pgp ]]; then su builder -c 'gpg --batch --import keys/pgp/*.asc'; fi
          su builder -c 'makepkg -f --noconfirm && makepkg --printsrcinfo > .SRCINFO'
          pacman -U --noconfirm "$AUR_PKG"-*.pkg.tar.zst
          su builder -c '${{ matrix.check }}'

      - name: Lint
        if: steps.check.outputs.skip != 'true'
        working-directory: ${{ matrix.pkg }}
        run: |
          # ponytail: namcap findings are annotations, not failures; make E: lines fatal once runs are clean
          namcap PKGBUILD "$AUR_PKG"-*.pkg.tar.zst | sed 's/^/::warning title=namcap::/'
          git -c safe.directory="$GITHUB_WORKSPACE" diff --quiet .SRCINFO ||
            echo "::warning title=.SRCINFO::committed .SRCINFO differs from makepkg --printsrcinfo (regenerated)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.skip != 'true'
        with:
          name: aur-${{ matrix.pkg }}
          path: |
            ${{ matrix.pkg }}/PKGBUILD
            ${{ matrix.pkg }}/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Holds the AUR key. Never sources PKGBUILD or runs anything from the build.
  publish:
    needs: build
    # Publish packages that built even if another failed; never from a pull request.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Pinned AUR host key (matches fingerprint published on aur.archlinux.org)
      AUR_HOST_KEY: aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: aur-*
          path: ${{ runner.temp }}/built

      - name: Publish to AUR, then commit here
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          BUILT: ${{ runner.temp }}/built
        run: |
          shopt -s nullglob
          dirs=("$BUILT"/aur-*)
          (( ${#dirs[@]} )) || { echo "Nothing to publish"; exit 0; }

          ssh_dir=$RUNNER_TEMP/ssh
          install -dm700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/key" && chmod 600 "$ssh_dir/key"
          echo "$AUR_HOST_KEY" > "$ssh_dir/known_hosts"
          aur_ssh="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"

          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for dir in "${dirs[@]}"; do
            pkg=${dir##*/aur-}
            ver=$(awk -F' = ' '$1=="\tpkgver"{v=$2} $1=="\tpkgrel"{r=$2} END{print v"-"r}' "$dir/.SRCINFO")
            echo "::group::$pkg $ver"

            # AUR first: if this fails, nothing lands here and the next run retries.
            aur=$RUNNER_TEMP/aur-$pkg
            GIT_SSH_COMMAND=$aur_ssh git clone -q "ssh://aur@aur.archlinux.org/$pkg.git" "$aur"
            # Tracked package files (service units, scripts...), then the built PKGBUILD/.SRCINFO.
            (cd "$pkg" && git ls-files -z | xargs -0 cp --parents -t "$aur/")
            cp "$dir/PKGBUILD" "$dir/.SRCINFO" "$aur/"
            git -C "$aur" add -A
            if git -C "$aur" diff --cached --quiet; then
              echo "AUR already up to date"
            else
              git -C "$aur" commit -q -s -m "Update to $ver"
              GIT_SSH_COMMAND=$aur_ssh git -C "$aur" push origin HEAD:master
            fi

            cp "$dir/PKGBUILD" "$dir/.SRCINFO" "$pkg/"
            git add "$pkg/PKGBUILD" "$pkg/.SRCINFO"
            git diff --cached --quiet || git commit -q -s -m "$pkg: update to $ver"
            echo "::endgroup::"
          done

          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
