name = "aur-trigger"
main = "worker.js"
compatibility_date = "2026-11-01"
# No HTTP handler: the Worker runs only on email and cron, so skip the public workers.dev URL.
workers_dev = false

[vars]
REPO = "pen-pal/aur-packages"

[triggers]
crons = ["17 * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true

[placement]
mode = "smart"
